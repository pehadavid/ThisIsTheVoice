# Builds, tests and validates the plugin on Linux, macOS and Windows, and packages the
# installers. Then, depending on the branch:
#   push to dev    replaces the "Development build" pre-release (tag dev-build), files
#                  named <version>-dev.<run number>
#   push to main   publishes release v<version> (version from CMakeLists.txt), unless
#                  it already exists; versions below 1.0 are marked as pre-releases
#   pull request   build, tests and validators only
name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(sed -n 's/^project(ThisIsTheVoice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          channel=none
          label="$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            channel=dev
            label="$version-dev.$GITHUB_RUN_NUMBER"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            channel=main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $version, files $label, channel $channel"

  linux:
    needs: version
    # The oldest supported runner, so the binaries run on older distributions (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libgl-dev libjack-jackd2-dev

      - name: Build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release

      - name: Tests
        run: ctest --test-dir build/release --output-on-failure

      - name: clap-validator and pluginval
        run: scripts/ci/validate.sh build/release

      - name: Steinberg VST3 validator
        run: scripts/ci/vst3-validator.sh build/release

      - name: Package
        env:
          TITV_PACKAGE_VERSION: ${{ needs.version.outputs.label }}
        run: scripts/package-linux.sh build/release

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: brew install ninja

      - name: Build (universal)
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/macos

      - name: Tests
        run: ctest --test-dir build/macos --output-on-failure

      - name: clap-validator and pluginval
        run: scripts/ci/validate.sh build/macos

      - name: Package
        env:
          TITV_PACKAGE_VERSION: ${{ needs.version.outputs.label }}
        run: scripts/package-macos.sh build/macos

      - name: Install from the zip as a user would, then auval
        run: |
          work="$RUNNER_TEMP/zip-install"
          mkdir -p "$work"
          ditto -x -k dist/*-macos.zip "$work"
          folder="$(ls -d "$work"/ThisIsTheVoice-*-macos)"
          # What a browser download leaves on every file.
          xattr -w -r com.apple.quarantine "0081;00000000;Safari;" "$folder"
          bash "$folder/install.sh"
          for b in CLAP/ThisIsTheVoice.clap VST3/ThisIsTheVoice.vst3 Components/ThisIsTheVoice.component; do
            if xattr -r ~/Library/Audio/Plug-Ins/$b | grep -q com.apple.quarantine; then
              echo "Quarantine flag left on $b" >&2; exit 1
            fi
            codesign --verify --deep ~/Library/Audio/Plug-Ins/$b
          done
          auval -v aufx TiTV Peha

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release

      - name: Tests
        run: ctest --test-dir build/release --output-on-failure

      - name: clap-validator and pluginval
        run: scripts/ci/validate.sh build/release

      - name: Package
        run: |
          choco install innosetup -y --no-progress
          # MSYS2_ARG_CONV_EXCL: keep Git Bash from turning the /D options into paths.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ needs.version.outputs.label }}" \
            "/DBuildDir=$(cygpath -w "$PWD/build/release")" packaging/windows/ThisIsTheVoice.iss

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: needs.version.outputs.channel != 'none'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Replace the development build
        if: needs.version.outputs.channel == 'dev'
        run: |
          scripts/ci/release-notes.sh "$LABEL" dev > notes.md
          gh release delete dev-build --cleanup-tag --yes 2> /dev/null || true
          gh release create dev-build dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Development build $LABEL" --notes-file notes.md

      - name: Publish the version
        if: needs.version.outputs.channel == 'main'
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::notice::v$VERSION is already released; raise the version in CMakeLists.txt to publish a new one."
            exit 0
          fi
          scripts/ci/release-notes.sh "$LABEL" > notes.md
          prerelease=()
          case "$VERSION" in 0.*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" "${prerelease[@]}" \
            --title "This Is The Voice $VERSION" --notes-file notes.md --generate-notes
